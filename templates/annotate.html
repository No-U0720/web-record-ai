<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 手動標註與修復工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --panel-border: #334155;
      --accent-color: #ec4899;
      --accent-hover: #db2777;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --box-color: #38bdf8;
      --box-selected: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f472b6, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btns {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-save {
      background-color: #0284c7;
      color: #fff;
    }

    .btn-save:hover {
      background-color: #0369a1;
    }

    .btn-train {
      background-color: var(--accent-color);
      color: #fff;
    }

    .btn-train:hover {
      background-color: var(--accent-hover);
    }

    .btn-clear {
      background-color: #475569;
      color: #fff;
    }

    .btn-clear:hover {
      background-color: #334155;
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 49px);
    }

    .sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .img-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .img-item {
      padding: 12px 16px;
      font-size: 0.875rem;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }

    .img-item:hover {
      background-color: #334155;
    }

    .img-item.active {
      background-color: #0f172a;
      border-left: 4px solid var(--accent-color);
      font-weight: 600;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-has {
      background-color: #064e3b;
      color: #34d399;
    }

    .badge-none {
      background-color: #7f1d1d;
      color: #f87171;
    }

    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      background-color: #090d16;
      padding: 15px 20px 20px 20px;
      overflow: auto;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: calc(100vh - 120px);
    }

    #imageCanvas {
      display: block;
      cursor: crosshair;
      max-height: calc(100vh - 120px);
      max-width: 100%;
      height: auto;
      width: auto;
      object-fit: contain;
    }

    .toolbar {
      margin-top: 4px;
      margin-bottom: 10px;
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      padding: 6px 18px;
      border-radius: 30px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .tool-info {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Modal / Alert */
    .toast {
      position: fixed;
      top: 80px;
      right: 24px;
      background-color: #10b981;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏷️ AI 手動標註與修正工具</h1>
    <div class="action-btns">
      <button class="btn-clear" style="background-color: #10b981;" onclick="takePhotoSnapshot()">📸 拍照 (Take Photo)</button>
      <button class="btn-clear" onclick="deleteSelectedBox()">🗑️ 刪除選取框 (Delete)</button>
      <button class="btn-save" onclick="saveAnnotations()">💾 儲存標註邊框</button>
      <button class="btn-train" onclick="retrainModel()">🚀 重新訓練 AI</button>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">圖片清單 (user_uploads)</div>
      <ul class="img-list" id="imageList"></ul>
    </div>

    <div class="workspace">
      <div class="toolbar">
        <span class="tool-info">🎨 選擇標註顏色類別：</span>
        <select id="colorClassSelect" onchange="changeCurrentColorClass()" style="padding: 6px 14px; border-radius: 6px; background-color: #0f172a; color: #fff; border: 1px solid var(--panel-border); font-weight: 600; cursor: pointer; font-size: 0.95rem;">
          <option value="0" style="color: #f87171;">🔴 Red (紅色橡皮筋)</option>
          <option value="1" style="color: #facc15;">🟡 Yellow (黃色橡皮筋)</option>
          <option value="2" style="color: #4ade80;">🟢 Green (綠色橡皮筋)</option>
        </select>
        <span class="tool-info" style="margin-left: 10px;">💡 提示：按住滑鼠<b>左鍵拖曳</b>畫新框；點擊已有畫框可<b>切換類別/刪除</b>。</span>
      </div>

      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="imageCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    let currentImageName = "";
    let imageObj = new Image();
    let boxes = [];
    let selectedBoxIndex = -1;

    let isDrawing = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;

    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');

    const classColors = {
      0: '#ff2d55', // Red (亮紅)
      1: '#ffcc00', // Yellow (亮黃)
      2: '#34c759'  // Green (亮綠)
    };

    const classNames = {
      0: '🔴 Red (紅)',
      1: '🟡 Yellow (黃)',
      2: '🟢 Green (綠)'
    };

    function changeCurrentColorClass() {
      const selectVal = parseInt(document.getElementById('colorClassSelect').value);
      if (selectedBoxIndex >= 0 && selectedBoxIndex < boxes.length) {
        boxes[selectedBoxIndex].class_id = selectVal;
        draw();
        saveAnnotations();
      }
    }

    // 載入圖片列表
    async function loadImagesList() {
      const res = await fetch('/api/images');
      const data = await res.json();
      const listEl = document.getElementById('imageList');
      listEl.innerHTML = "";

      data.images.forEach(img => {
        const li = document.createElement('li');
        li.className = `img-item ${img.name === currentImageName ? 'active' : ''}`;
        li.onclick = () => selectImage(img.name);

        const nameSpan = document.createElement('span');
        nameSpan.innerText = img.name;

        const badge = document.createElement('span');
        badge.className = `badge ${img.has_label ? 'badge-has' : 'badge-none'}`;
        badge.innerText = img.has_label ? '已標註' : '未標註';

        li.appendChild(nameSpan);
        li.appendChild(badge);
        listEl.appendChild(li);
      });

      if (!currentImageName && data.images.length > 0) {
        selectImage(data.images[0].name);
      }
    }

    // 切換當前編輯圖片
    async function selectImage(name) {
      currentImageName = name;
      loadImagesList();

      const res = await fetch(`/api/annotation?name=${encodeURIComponent(name)}`);
      const data = await res.json();
      boxes = data.boxes || [];
      selectedBoxIndex = -1;

      imageObj.src = `/images/${encodeURIComponent(name)}?t=${Date.now()}`;
      imageObj.onload = () => {
        canvas.width = imageObj.width;
        canvas.height = imageObj.height;
        draw();
      };
    }

    // 繪製畫布與所有標註邊框
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(imageObj, 0, 0);

      boxes.forEach((b, idx) => {
        const isSelected = (idx === selectedBoxIndex);
        const strokeColor = classColors[b.class_id] || '#38bdf8';
        const labelName = classNames[b.class_id] || `Class ${b.class_id}`;

        // 繪製邊框背景 (增強層次感)
        ctx.strokeStyle = isSelected ? '#ffffff' : '#000000';
        ctx.lineWidth = isSelected ? 6 : 4;
        ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);

        ctx.strokeStyle = isSelected ? '#00ffff' : strokeColor;
        ctx.lineWidth = isSelected ? 4 : 3;
        ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);

        // 標記背景標籤
        ctx.font = 'bold 16px Inter, sans-serif';
        const textWidth = ctx.measureText(labelName).width;
        
        ctx.fillStyle = isSelected ? '#00ffff' : strokeColor;
        ctx.fillRect(b.x1, Math.max(0, b.y1 - 26), textWidth + 16, 26);

        // 標籤文字 (黑色強對比)
        ctx.fillStyle = '#000000';
        ctx.fillText(labelName, b.x1 + 8, Math.max(18, b.y1 - 7));
      });

      // 繪製拖曳中的暫存框
      if (isDrawing) {
        const currentSelectedClass = parseInt(document.getElementById('colorClassSelect').value);
        ctx.strokeStyle = classColors[currentSelectedClass] || '#ec4899';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
        ctx.setLineDash([]);
      }
    }

    // Canvas 互動事件
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      // 檢查是否點擊現有的 Box
      let clickedIdx = -1;
      for (let i = boxes.length - 1; i >= 0; i--) {
        const b = boxes[i];
        if (clickX >= b.x1 && clickX <= b.x2 && clickY >= b.y1 && clickY <= b.y2) {
          clickedIdx = i;
          break;
        }
      }

      if (clickedIdx !== -1) {
        selectedBoxIndex = clickedIdx;
        document.getElementById('colorClassSelect').value = boxes[selectedBoxIndex].class_id || 0;
        draw();
      } else {
        selectedBoxIndex = -1;
        isDrawing = true;
        startX = clickX;
        startY = clickY;
        currentX = clickX;
        currentY = clickY;
        draw();
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      currentX = (e.clientX - rect.left) * scaleX;
      currentY = (e.clientY - rect.top) * scaleY;
      draw();
    });

    canvas.addEventListener('mouseup', () => {
      if (isDrawing) {
        isDrawing = false;
        const x1 = Math.min(startX, currentX);
        const y1 = Math.min(startY, currentY);
        const x2 = Math.max(startX, currentX);
        const y2 = Math.max(startY, currentY);

        const currentSelectedClass = parseInt(document.getElementById('colorClassSelect').value);

        // 避免太小的誤觸點擊框
        if (x2 - x1 > 10 && y2 - y1 > 10) {
          boxes.push({ class_id: currentSelectedClass, x1: Math.round(x1), y1: Math.round(y1), x2: Math.round(x2), y2: Math.round(y2) });
          selectedBoxIndex = boxes.length - 1;
          saveAnnotations(); // ⚡ 自動即時同步儲存
        }
        draw();
      }
    });

    // 刪除選取的標註框
    function deleteSelectedBox() {
      if (selectedBoxIndex >= 0 && selectedBoxIndex < boxes.length) {
        boxes.splice(selectedBoxIndex, 1);
        selectedBoxIndex = -1;
        draw();
        saveAnnotations(); // ⚡ 自動即時同步儲存
      }
    }

    // 鍵盤 Delete 快捷鍵刪除
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        deleteSelectedBox();
      }
    });

    // 儲存標註邊框
    async function saveAnnotations() {
      if (!currentImageName) return;

      const res = await fetch('/api/save_annotation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: currentImageName,
          boxes: boxes
        })
      });

      const data = await res.json();
      if (data.success) {
        showToast(data.message);
        loadImagesList();
      }
    }

    // 觸發重新訓練 AI
    async function retrainModel() {
      const trainBtn = document.querySelector('.btn-train');
      trainBtn.disabled = true;
      trainBtn.style.opacity = '0.6';
      trainBtn.innerHTML = '⏳ 啟動訓練中...';

      try {
        const res = await fetch('/api/retrain', { method: 'POST' });
        const data = await res.json();
        showToast(data.message, 3000);

        if (!data.success) {
          trainBtn.disabled = false;
          trainBtn.style.opacity = '1';
          trainBtn.innerHTML = '🚀 重新訓練 AI';
          return;
        }

        // 開始輪詢訓練狀態
        const pollTimer = setInterval(async () => {
          try {
            const statusRes = await fetch('/api/retrain_status');
            const statusData = await statusRes.json();

            if (statusData.status === 'running') {
              trainBtn.innerHTML = `⏳ ${statusData.message || '訓練進行中...'}`;
            } else if (statusData.status === 'completed') {
              clearInterval(pollTimer);
              showToast(statusData.message, 6000);
              trainBtn.disabled = false;
              trainBtn.style.opacity = '1';
              trainBtn.innerHTML = '🚀 重新訓練 AI';
              if (currentImageName) selectImage(currentImageName);
            } else if (statusData.status === 'error') {
              clearInterval(pollTimer);
              alert("訓練發生錯誤：" + statusData.error);
              trainBtn.disabled = false;
              trainBtn.style.opacity = '1';
              trainBtn.innerHTML = '🚀 重新訓練 AI';
            }
          } catch (e) {
            console.error("Poll error:", e);
          }
        }, 1000);

      } catch (err) {
        alert("請求失敗：" + err);
        trainBtn.disabled = false;
        trainBtn.style.opacity = '1';
        trainBtn.innerHTML = '🚀 重新訓練 AI';
      }
    }

    // 觸發鏡頭拍照快照
    async function takePhotoSnapshot() {
      try {
        const res = await fetch('/api/snapshot', { method: 'POST' });
        const data = await res.json();
        showToast(data.message);
        if (data.success) {
          await loadImagesList();
          if (data.filename) selectImage(data.filename);
        }
      } catch (err) {
        alert("拍照失敗：" + err);
      }
    }

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, duration);
    }

    // 初始化
    loadImagesList();
  </script>
</body>
</html>
